name: Student setup
on: [push, pull_request]
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked marimo check --strict exercises
      - run: uv run --locked python start.py --block 1 --check
      - run: uv run --locked python start.py --block 2 --check
      - run: uv run --locked python start.py --block 3 --check
      - run: uv run --locked python start.py --block 5 --check
      - run: uv run --locked python start.py --day 2 --block 1 --check
      - run: uv run --locked python start.py --day 2 --block 2 --check
      - run: uv run --locked python start.py --day 2 --block 3 --check
      - run: uv run --locked python start.py --day 2 --block 4 --check
      - run: uv run --locked python start.py --day 2 --block 5 --check
      - run: uv run --offline --locked python start.py --day 2 --block 5 --offline-assets --check
      - run: uv run --locked python start.py --day 3 --block 1 --check
      - run: uv run --locked python start.py --day 3 --block 2 --check
      - run: uv run --locked python start.py --day 3 --block 4 --check
      - run: uv run --locked python start.py --day 3 --block 5 --check
      - run: uv run --offline --locked python start.py --day 3 --block 4 --offline-assets --check
